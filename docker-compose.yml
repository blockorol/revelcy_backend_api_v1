version: "3.8"

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revelcy
    ports:
      - "5432:5432"

  migrations:
    build: .
    command: ["goose", "postgres", "postgres://postgres:postgres@db:5432/revelcy?sslmode=disable", "up"]
    depends_on:
      - db

  backend:
    build: .
    env_file:
      - .env 
    depends_on:
      - db
      - migrations
    ports:
      - "8080:8080"
