version: "3.8"

services:
  db:
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revelcy
    ports:
      - "5432:5432"

  backend:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:8080"
